<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc"><title id="title">RelayAid architecture and approval boundaries</title><desc id="desc">Physical buttons communicate with a laptop SQLite outbox. The bridge synchronizes to an authoritative Spacetime database. Coordinators approve proposals. A restricted worker uses a deterministic solver and Nemotron without approval permissions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#356b70"/></marker></defs><rect width="1440" height="1160" fill="#f7fafb"/><g font-family="Arial, sans-serif" fill="#173238"><text x="60" y="68" font-size="38" font-weight="700">RelayAid implementation architecture</text><text x="60" y="105" font-size="20">One durable input path. One shared authority. Explicit human approval.</text>
<rect x="60" y="160" width="380" height="150" rx="16" fill="#eaf4f2" stroke="#b3c7c5"/><text x="82" y="194" font-size="22" font-weight="700">Physical station</text><text x="82" y="225" font-size="17">Two buttons + status indicators</text><text x="82" y="250" font-size="17">USB session / press sequence</text><text x="82" y="275" font-size="17">No cloud credential; no flash claim</text>
<rect x="530" y="160" width="380" height="150" rx="16" fill="#eaf4f2" stroke="#b3c7c5"/><text x="552" y="194" font-size="22" font-weight="700">Laptop bridge</text><text x="552" y="225" font-size="17">SQLite outbox + status cache</text><text x="552" y="250" font-size="17">Commit before saved indication</text><text x="552" y="275" font-size="17">Same request ID on every retry</text>
<rect x="1000" y="160" width="380" height="150" rx="16" fill="#eaf4f2" stroke="#b3c7c5"/><text x="1022" y="194" font-size="22" font-weight="700">Resident display</text><text x="1022" y="225" font-size="17">Saved / delivered / acknowledged</text><text x="1022" y="250" font-size="17">Assigned / completed + freshness</text><text x="1022" y="275" font-size="17">Selected request + pending count</text>
<rect x="340" y="420" width="760" height="175" rx="16" fill="#dceceb" stroke="#b3c7c5"/><text x="362" y="454" font-size="22" font-weight="700">SpacetimeDB — authoritative backend</text><text x="362" y="485" font-size="17">Private tables + identity-scoped views + transactional reducers</text><text x="362" y="510" font-size="17">Requests / events / resources / snapshots / proposals / reservations</text><text x="362" y="535" font-size="17">Version checks + allocation epoch + idempotent command receipts</text><text x="362" y="560" font-size="17">Only a coordinator can approve; capacity is reserved atomically</text>
<rect x="60" y="710" width="390" height="150" rx="16" fill="#eaf4f2" stroke="#b3c7c5"/><text x="82" y="744" font-size="22" font-weight="700">Coordinator / volunteer UI</text><text x="82" y="775" font-size="17">Acknowledge and review proposal</text><text x="82" y="800" font-size="17">Coordinator approves exact plan</text><text x="82" y="825" font-size="17">Assigned actor records completion</text>
<rect x="545" y="710" width="390" height="150" rx="16" fill="#eaf4f2" stroke="#b3c7c5"/><text x="567" y="744" font-size="22" font-weight="700">Restricted proposal worker</text><text x="567" y="775" font-size="17">Claims an authorized proposal run</text><text x="567" y="800" font-size="17">Fixed solver policy + FCFS baseline</text><text x="567" y="825" font-size="17">Read / solve / compare / propose</text>
<rect x="1030" y="710" width="350" height="150" rx="16" fill="#eaf0fa" stroke="#b3c7c5"/><text x="1052" y="744" font-size="22" font-weight="700">Nemotron endpoint</text><text x="1052" y="775" font-size="17">Actual available model + tools</text><text x="1052" y="800" font-size="17">Bounded calls and timeout</text><text x="1052" y="825" font-size="17">No approve or dispatch tool</text>
<g fill="none" stroke="#356b70" stroke-width="3" marker-end="url(#arrow)"><path d="M440 235 H520" marker-start="url(#arrow)"/><path d="M910 235 H990"/><path d="M720 310 V410" marker-start="url(#arrow)"/><path d="M340 495 H250 V700"/><path d="M300 710 V625 H480 V605"/><path d="M740 710 V605"/><path d="M810 595 V700"/><path d="M935 765 H1020"/><path d="M1030 815 H945"/></g>
<text x="452" y="216" font-size="15">USB</text><text x="735" y="365" font-size="17">authenticated retry + confirmed status</text><text x="355" y="655" font-size="16">human actions</text><text x="820" y="656" font-size="16">snapshot / run</text>
<rect x="60" y="930" width="1320" height="155" rx="16" fill="#fff" stroke="#b3c7c5"/><text x="85" y="965" font-size="22" font-weight="700">Critical invariants</text><text x="85" y="1000" font-size="18">1  Local save ≠ server delivery ≠ human acknowledgement ≠ completion.</text><text x="85" y="1030" font-size="18">2  Model output creates a proposal only. Approval rechecks current state inside one transaction.</text><text x="85" y="1060" font-size="18">3  Internet outage permits laptop-local capture only. Accepted IDs persist; new offline requests are not remotely visible.</text><text x="60" y="1128" font-size="15" fill="#536c70">Proposed blueprint • Synthetic hackathon demonstration • Hardware, provider access and tested guarantees must be verified</text></g></svg>